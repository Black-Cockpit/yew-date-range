# Tailwind CSS example application for the yew-date-range library.

[package]
name = "yew-date-range-tailwind-example"
description = "Tailwind CSS example application demonstrating yew-date-range with dark mode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The date range picker library.
yew-date-range = { workspace = true }

# Yew framework for WebAssembly frontend development.
yew = { workspace = true }

# Date and time library with WASM support.
time = { workspace = true }

# Rust-to-JavaScript interop layer for WebAssembly.
wasm-bindgen = { workspace = true }

# WebAssembly browser API bindings.
web-sys = { workspace = true, features = ["HtmlElement"] }
