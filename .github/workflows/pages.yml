# GitHub Pages Pipeline — Yew Date Range
#
# Automated deployment pipeline for publishing the documentation page
# and both example applications to GitHub Pages. Builds both Yew examples
# using Trunk and assembles them into a single site with three routes:
#   - /yew-date-range/             → docs landing page
#   - /yew-date-range/example/     → default CSS example
#   - /yew-date-range/example-tailwind/ → Tailwind CSS example

name: Deploy to GitHub Pages

# Triggers
# Run on pushes to the master branch, or manual dispatch.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Permissions
# Required for GitHub Pages deployment.

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency
# Prevent concurrent deployments to avoid conflicts.

concurrency:
  group: "pages"
  cancel-in-progress: true

# Jobs

jobs:
  build:
    name: Build Docs & Examples
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up the Rust toolchain with the WASM target.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Install Trunk for building Yew WASM applications.
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # Cache Cargo dependencies to speed up subsequent builds.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pages-

      # Build the default CSS example with the Pages sub-path.
      - name: Build default example
        run: trunk build --release --public-url /yew-date-range/example/
        working-directory: example

      # Build the Tailwind CSS example with the Pages sub-path.
      - name: Build Tailwind example
        run: trunk build --release --public-url /yew-date-range/example-tailwind/
        working-directory: example-tailwind

      # Assemble the final site directory with all three routes.
      - name: Assemble site
        run: |
          mkdir -p _site/example
          mkdir -p _site/example-tailwind
          cp docs/index.html _site/index.html
          cp -r example/dist/* _site/example/
          cp -r example-tailwind/dist/* _site/example-tailwind/

      # Configure and upload the assembled site as a Pages artifact.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
