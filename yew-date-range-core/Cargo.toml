# Yew Date Range Core — Cargo Manifest
#
# A headless date range picker engine for Rust/WASM applications.
# Provides the core date logic including models, utilities, date helpers,
# range calculations, and locale support — all without UI dependencies.

[package]

# Package name as published on crates.io.
name = "yew-date-range-core"

# Brief description of the package purpose and scope.
description = "Headless date range picker engine for Rust/WASM - react-date-range inspired"

# Inherited workspace metadata.
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Markdown documentation file for crates.io.
readme = "../README.md"

# Package categorization for crate registry.
keywords = ["web", "wasm", "date-picker", "headless", "calendar"]
categories = ["wasm"]

# Dependencies

[dependencies]

# Date and time library with WASM support.
time = { workspace = true }

# JavaScript interop for WASM date access.
js-sys = { workspace = true }

# Rust-to-JavaScript interop layer for WebAssembly.
wasm-bindgen = { workspace = true }

# Development Dependencies

[dev-dependencies]

# Date and time library with macro support for tests.
time = { workspace = true }
