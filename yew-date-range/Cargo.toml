# Yew Date Range — Cargo Manifest
#
# Date range picker component library for Yew applications inspired by
# react-date-range and PrimeReact Calendar. Provides Yew components,
# pre-built UI elements, and seamless integration with the headless
# yew-date-range-core engine.

[package]

# Package name as published on crates.io.
name = "yew-date-range"

# Brief description of the package purpose and scope.
description = "Date range picker component library for Yew - react-date-range inspired"

# Inherited workspace metadata.
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# Markdown documentation file for crates.io.
readme = "../README.md"

# Package categorization for crate registry.
keywords = ["web", "wasm", "yew", "date-picker", "component"]
categories = ["wasm"]

# Feature Configuration

[features]

# Default feature set activated when none are explicitly specified.
default = []

# Dependencies

[dependencies]

# Headless date range picker engine providing core logic and state management.
yew-date-range-core = { workspace = true }

# Yew framework for WebAssembly frontend development.
yew = { workspace = true }

# Date and time library with WASM support.
time = { workspace = true }

# WebAssembly browser API bindings for DOM element access.
web-sys = { workspace = true, features = [
    "HtmlElement",
    "HtmlInputElement",
    "MouseEvent",
    "KeyboardEvent",
    "DomRect",
    "Element",
    "FocusEvent",
    "WheelEvent",
    "Window",
    "Document",
] }

# Rust-to-JavaScript interop layer for WebAssembly.
wasm-bindgen = { workspace = true }

# Gloo utilities for WebAssembly browser APIs.
gloo = { workspace = true }
