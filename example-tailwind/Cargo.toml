# Tailwind CSS example application for the yew-date-range library.

[package]
name = "yew-date-range-tailwind-example"
version = "0.1.0"
edition = "2021"

[dependencies]
# Yew framework for WebAssembly frontend development.
yew = { version = "0.21", features = ["csr"] }

# The date range picker library.
yew-date-range = { path = "../yew-date-range" }

# Date and time library with WASM support.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "wasm-bindgen"] }

# Rust-to-JavaScript interop layer for WebAssembly.
wasm-bindgen = "0.2"

# WebAssembly browser API bindings.
web-sys = { version = "0.3", features = ["HtmlElement"] }
