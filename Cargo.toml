# Yew Date Range — Cargo Workspace
#
# A date range picker component library for Yew applications,
# inspired by react-date-range. The workspace contains the headless
# core engine, the Yew integration layer, and demonstration examples.

[workspace]

# Workspace resolver version for dependency unification.
resolver = "2"

# Workspace members: core engine, UI layer, example applications, and e2e tests.
members = [
    "yew-date-range-core",
    "yew-date-range",
    "examples/default",
    "examples/tailwind",
    "e2e-tests",
]

# Shared package metadata inherited by all workspace members.
[workspace.package]

# Current release version.
version = "0.2.0"

# Rust edition for language and compiler features.
edition = "2024"

# Maintainers and organizational ownership.
authors = ["Hasni Mehdi <hasnimehdi@outlook.com>"]

# Open-source license.
license = "MIT"

# Source code repository.
repository = "https://github.com/Black-Cockpit/yew-date-range"

# Official project homepage.
homepage = "https://github.com/Black-Cockpit/yew-date-range"

# Minimum supported Rust version.
rust-version = "1.85"

# Shared workspace dependencies referenced by member crates.
[workspace.dependencies]

# Internal crate references.
# Both `path` (for local development) and `version` (for crates.io resolution)
# are specified so that `cargo publish` resolves the dependency from the registry
# while local builds use the workspace path.
yew-date-range-core = { path = "./yew-date-range-core", version = "0.2.0" }
yew-date-range = { path = "./yew-date-range", version = "0.2.0" }

# Yew framework for WebAssembly frontend development.
yew = { version = "0.23.0", features = ["csr"] }

# Date and time library with WASM support.
time = { version = "0.3.47", features = ["formatting", "parsing", "macros", "wasm-bindgen"] }

# JavaScript interop for WASM date access.
js-sys = "0.3.94"

# WebAssembly browser API bindings.
web-sys = "0.3.94"

# Rust-to-JavaScript interop layer for WebAssembly.
wasm-bindgen = "0.2.117"

# Gloo utilities for WebAssembly browser APIs.
gloo = { version = "0.12.0", features = ["timers", "events"] }

# Browser automation via Playwright for Rust (dev-only).
playwright = "0.0.20"

# Async runtime for test execution (dev-only).
tokio = { version = "1.50.0", features = ["full"] }

# Static file server for serving built examples (dev-only).
actix-web = "4.13.0"

# Static file serving middleware (dev-only).
actix-files = "0.6.10"

# CORS middleware for test server (dev-only).
actix-cors = "0.7.1"

# Serialization framework for encoding and decoding structured data.
serde = { version = "1.0.228", features = ["derive"] }

# JSON parser and serializer for structured data.
serde_json = "1.0.149"

# Deny warnings in clippy
[workspace.metadata]
clippy = { deny = ["warnings"] }
